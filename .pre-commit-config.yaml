# Runs the same checks as .github/workflows/pr-gate.yml before each commit,
# and before each merge commit (so a merge that breaks the build is caught
# where it's made, not in CI).
# Setup, once per clone: uv sync && uv run pre-commit install
# Run by hand: uv run pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-merge-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        exclude: ^src/launcher/
      - id: ruff-format
        exclude: ^src/launcher/

  - repo: local
    hooks:
      # pyright needs the project's environment so toga and friends resolve.
      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --locked pytest -q
        language: system
        types: [python]
        pass_filenames: false
