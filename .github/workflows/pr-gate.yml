name: Pull Request Approval Gate

on:
  # Every PR, including ones stacked on another feature branch (#73)
  pull_request:
    # `edited` covers retargeting, e.g. a stacked PR moved to main after its
    # base merges; other edits (title, body) are skipped below
    types: [ opened, synchronize, reopened, edited ]

concurrency:
  # Edits that don't change the base get their own group, so a title change
  # can't cancel a run that is already in progress
  group: pr-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && github.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Lint, Type Check & Unit Tests (GitHub Cloud Runner)
  # -------------------------------------------------------------
  quality-gate:
    name: Lint & Unit Tests
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.15

      - name: Install Dependencies
        # Same locked dev group as on desktop (see CLAUDE.md)
        run: uv sync --locked --python 3.15

      - name: Run Ruff Linter
        run: uv run --locked ruff check .

      - name: Run pyright Type Checker
        run: uv run --locked pyright

      - name: Run Tests
        run: uv run --locked pytest

  # -------------------------------------------------------------
  # Job 2: Icon Generation & Briefcase Xcode Build (Mac Mini)
  # -------------------------------------------------------------
  briefcase-build:
    name: Briefcase iOS Compilation
    needs: quality-gate      # Only trigger if Job 1 passes
    # The macOS build is slow; stacked PRs get it once retargeted to main
    if: github.base_ref == 'main'
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: 'pip'

      - name: Ensure Python Environment & Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pillow briefcase

      - name: Generate App Icon & Splash Assets
        run: |
          if [ -f "generate_icons.py" ]; then
            # Executes your Pillow script to produce opaque icon.png and transparent splash.png
            python3 generate_icons.py
          fi

      - name: Create Briefcase iOS Project
        run: |
          # Scaffolds/updates the Xcode project wrapper in build/
          briefcase create iOS

      - name: Compile iOS Binary
        run: |
          # Compiles Python support files and verifies Xcode app bundling
          briefcase build iOS
