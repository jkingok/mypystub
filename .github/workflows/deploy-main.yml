name: Continuous Delivery to TestFlight

# Manual only: the push trigger failed on every merge to main because
# GitHub-hosted runners have no App Store Connect credentials (see #28).
# Ship builds from a Mac clone instead; see "Releasing to TestFlight" in README.md.
# Everything else (icons, Briefcase, version, release notes, tag) is in the
# Fastlane share lane.
on:
  workflow_dispatch:

permissions:
  contents: write # the share lane pushes the release notes commit and the tag

jobs:
  testflight:
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history and tags, for build numbers and the tag

      - name: Fastlane Share
        run: |
          # Source local App Store Connect credentials from runner
          source $HOME/.appstore_connect/env

          bundle exec fastlane ios share
