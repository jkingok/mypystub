name: Forward VNC to Tailnet VM
on: workflow_dispatch

jobs:
  vnc-tunnel:
    runs-on: self-hosted
    steps:
      - name: Generate SSH Key & Scan VM Host Key
        env:
          VM_TAILSCALE_IP: "3.26.237.4" # Replace with your VM's Tailscale IP or public IP
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Create ephemeral key pair if not present
          if [ ! -f ~/.ssh/id_vnc_tunnel ]; then
            ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_vnc_tunnel
          fi

          # Inject VM's host key into known_hosts without prompts
          ssh-keyscan -H $VM_TAILSCALE_IP >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "=================== COPY PUBLIC KEY BELOW ==================="
          cat ~/.ssh/id_vnc_tunnel.pub
          echo "============================================================="

      - name: Start VNC Reverse Tunnel
        env:
          VM_USER: "ubuntu"           # Replace with your VM username (e.g. root, ubuntu)
          VM_TAILSCALE_IP: "3.26.237.4" # Replace with your VM's Tailscale IP or public IP
        run: |
          echo "Starting VNC tunnel to Cloud VM..."
          # Forward remote port 5900 (bound to 0.0.0.0 on VM) to local 127.0.0.1:5900 on Mac mini
          ssh -i ~/.ssh/id_vnc_tunnel \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              -N -R 0.0.0.0:5900:127.0.0.1:5900 \
              ${VM_USER}@${VM_TAILSCALE_IP}