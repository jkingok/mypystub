[project]
name = "MyPyStub"
description = "My first application for prototyping with iDevices and Python"
# Version is managed by Fastlane
version = "0.0.2"
requires-python = ">=3.12"
dependencies = [
    "anyio",
    "certifi",
    "httpx2",
    "installer",
    "markdown",
    # Syntax highlighting for code in the Help page (pure Python)
    "pygments",
    "resolvelib",
    "tomlkit",
    "unearth",
]

[dependency-groups]
# Desktop and CI tooling only; never imported by the app or devtools.py.
# Toga is added per platform by Briefcase, so toga-core is listed here for pyright.
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "toga-core>=0.5.7",
    # Toga's test backend, for UI tests without a device (tests/test_ui.py)
    "toga-dummy>=0.5.7",
]

[tool.ruff]
line-length = 88
extend-exclude = ["build", "docs", "src/launcher"]

[tool.pyright]
include = ["src/mypystub"]
exclude = ["src/launcher", "build", "docs"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.stub_launcher]
display_name = "Launcher"  # Overrides the folder/project name in the list
entry_point = "src/launcher/__main__.py"          # The script file the launcher should execute
icon = "assets/src_icon.png"       # Relative path to this prototype's icon

# This project was generated with 0.4.2 using template: https://github.com/beeware/briefcase-template @ v0.4.2
[tool.briefcase]
project_name = "mypystub"
bundle = "au.id.jking"
# Version is managed by Fastlane
version = "0.0.2"
url = "https://github.com/jkingok/mypystub"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
author = "Joshua King"
author_email = "jkingok@users.noreply.github.com"

[tool.briefcase.app.mypystub]
formal_name = "MyPyStub"
description = "My first application for prototyping with iDevices and Python"
long_description = """More details about the app should go here.
"""
sources = [
    "src/mypystub",
]
test_sources = [
    "tests",
]

requires = [
    "anyio",
    "certifi",
    "httpx2",
    "installer",
    "markdown",
    # Syntax highlighting for code in the Help page (pure Python)
    "pygments",
    "resolvelib",
    "tomlkit",
    "unearth",
]
test_requires = [
    "pytest",
]


icon="assets/icons/png/icon-512"
splash_background_color="#7f7f7f"

# Hardware that prototypes may use. Briefcase turns these into iOS usage
# descriptions and Android manifest permissions; Toga refuses to start location
# or the camera without them. App Review requires each one to be used, so every
# permission has an example in resources/examples/hardware/ (enforced by
# tests/test_packaging.py). Background location, microphone and motion are left
# out until there is an example that uses them.
permission.fine_location = "Prototypes you run in MyPyStub may use your precise location."
permission.camera = "Prototypes you run in MyPyStub may take photos or video."
permission.photo_library = "Prototypes you run in MyPyStub may save images to your photo library."

[tool.briefcase.app.mypystub.macOS]
universal_build = true
requires = [
    "toga-cocoa~=0.5.7",
    "std-nslog~=1.0.3",
]

icon = "assets/icons/icon"

[tool.briefcase.app.mypystub.linux]
requires = [
    "toga-gtk~=0.5.7",
]

[tool.briefcase.app.mypystub.linux.system.debian]
system_requires = [
    # Needed to compile pycairo wheel
    "libcairo2-dev",
    "libgirepository-2.0-dev",
]

system_runtime_requires = [
    # Needed to provide GTK and its GI bindings
    "gir1.2-gtk-3.0",
    "libgirepository-2.0-0",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3-module",
    # Needed to provide WebKit2 at runtime
    # Note: Debian 11 requires gir1.2-webkit2-4.0 instead
    # "gir1.2-webkit2-4.1",
]

[tool.briefcase.app.mypystub.linux.system.rhel]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo-gobject-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
]

system_runtime_requires = [
    # Needed to support Python bindings to GTK
    "gobject-introspection",
    # Needed to provide GTK
    "gtk3",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3",
    # Needed to provide WebKit2 at runtime
    # "webkit2gtk3",
]

[tool.briefcase.app.mypystub.linux.system.suse]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
]

system_runtime_requires = [
    # Needed to provide GTK
    "gtk3",
    # Needed to support Python bindings to GTK
    "gobject-introspection", "typelib(Gtk) = 3.0",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3-module",
    # Needed to provide WebKit2 at runtime
    # "libwebkit2gtk3", "typelib(WebKit2)",
]

[tool.briefcase.app.mypystub.linux.system.arch]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo",
    # Needed to compile PyGObject wheel
    "gobject-introspection",
    # Runtime dependencies that need to exist so that the
    # Arch package passes final validation.
    # Needed to provide GTK
    "gtk3",
    # Dependencies that GTK looks for at runtime
    "libcanberra",
    # Needed to provide WebKit2
    # "webkit2gtk",
]

system_runtime_requires = [
    # Needed to provide GTK
    "gtk3",
    # Needed to provide PyGObject bindings
    "gobject-introspection-runtime",
    # Dependencies that GTK looks for at runtime
    "libcanberra",
    # Needed to provide WebKit2 at runtime
    # "webkit2gtk",
]

[tool.briefcase.app.mypystub.linux.appimage]
manylinux = "manylinux_2_28"

system_requires = [
    # Needed to compile pycairo wheel
    "cairo-gobject-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
    # Needed to provide GTK
    "gtk3-devel",
    # Dependencies that GTK looks for at runtime, that need to be
    # in the build environment to be picked up by linuxdeploy
    "libcanberra-gtk3",
    "PackageKit-gtk3-module",
    "gvfs-client",
]

linuxdeploy_plugins = [
    "DEPLOY_GTK_VERSION=3 gtk",
]

[tool.briefcase.app.mypystub.linux.flatpak]
flatpak_runtime = "org.gnome.Platform"
flatpak_runtime_version = "48"
flatpak_sdk = "org.gnome.Sdk"

[tool.briefcase.app.mypystub.windows]
requires = [
    "toga-winforms~=0.5.7",
]

icon = "assets/icons/icon"

installer_icon = "assets/icons/icon"

# Mobile deployments
[tool.briefcase.app.mypystub.iOS]
requires = [
# For the moment iOS needs bleeding edge packages
    "toga-core @ git+https://github.com/jkingok/beeware-toga.git@feature/ios-selection-done-rebased#subdirectory=core",
    "travertino @ git+https://github.com/jkingok/beeware-toga.git@feature/ios-selection-done-rebased#subdirectory=travertino",
    "toga-iOS @ git+https://github.com/jkingok/beeware-toga.git@feature/ios-selection-done-rebased#subdirectory=iOS",
    "std-nslog~=1.0.3",
# Since iOS does not allow binaries to be added after the fact
# we build in some for convenience
# See: https://beeware.org/mobile-wheels/
    "charset-normalizer>=3.5.0",
    "cffi>=2.1.0",
    "aiohttp>=3.14.0",
    "pillow>=11.3.0; python_version < '3.15'",
    "xxhash>=3.7.0",
    "mmh3>=5.2.0",
    "pybase64>=1.4.2",
    "maxminddb>=2.8.2",
# optree bundles an executable
#    "optree>=0.17.0",
    "cytoolz>=1.1.0",
    "lru-dict>=1.4.1; python_version < '3.15'",
]

icon = "assets/icons/ios/icon"

#[tool.briefcase.app.mypystub.iOS.app]
# Enable the Files app directory for your app
info."UIFileSharingEnabled" = true

# Allow opening documents in place
info."LSSupportsOpeningDocumentsInPlace" = true

# Usage descriptions with no cross-platform Briefcase permission key
info."NSLocalNetworkUsageDescription" = "Prototypes you run in MyPyStub may connect to devices on your local network."

[tool.briefcase.app.mypystub.android]
requires = [
    "toga-android~=0.5.7",
]

base_theme = "Theme.MaterialComponents.Light.DarkActionBar"

# Tell Briefcase to include custom Java source files in the Gradle build tree
build_vars = { "extra_java_sources" = ["assets/android/java"] }

# Inject the provider into AndroidManifest.xml
android_manifest_application_extra_content = """
<provider
    android:name="au.id.jking.mypystub.AppDocumentsProvider"
    android:authorities="au.id.jking.mypystub.documents"
    android:grantUriPermissions="true"
    android:exported="true"
    android:permission="android.permission.MANAGE_DOCUMENTS">
    <intent-filter>
        <action android:name="android.content.action.DOCUMENTS_PROVIDER" />
    </intent-filter>
</provider>
"""

build_gradle_dependencies = [
    "com.google.android.material:material:1.13.0",
    # Needed for DetailedList
    "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",
    # Needed for MapView
    # "org.osmdroid:osmdroid-android:6.1.20",
    # Needed for WebView
    "androidx.webkit:webkit:1.15.0",
]

# Needed for WebView
build_gradle_extra_content="""
chaquopy.defaultConfig.staticProxy("toga_android.widgets.internal.webview")
"""

icon = "assets/icons/android/icon"

# Web deployments
[tool.briefcase.app.mypystub.web]
requires = [
    "toga-web~=0.5.7",
]
